<!DOCTYPE html>
<html lang="en" class="no-scrollbar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JanSamadhan - Fix Your City</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-blue: #7c3aed; /* Violet 600 */
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-900: #0f172a;
      --emerald-500: #10b981;
      --amber-500: #f59e0b;
      --rose-500: #ef4444;
    }

    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background-color: var(--slate-50);
      color: var(--slate-900);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-size: 14px; /* Professional standard base size */
    }

    /* Global nuclear option to hide scrollbars everywhere */
    *::-webkit-scrollbar {
      display: none !important;
    }
    * {
      -ms-overflow-style: none !important;  /* IE and Edge */
      scrollbar-width: none !important;  /* Firefox */
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none !important;
    }
    .no-scrollbar {
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }

    .leaflet-container { 
      height: 100%; 
      width: 100%; 
      background: #f1f5f9;
    }

    /* Reset Leaflet marker defaults */
    .leaflet-marker-icon {
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
    }

    .mini-circular-popup .leaflet-popup-content-wrapper {
      border-radius: 50% !important;
      width: 80px;
      height: 80px;
      overflow: hidden;
      border: 2px solid white;
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.1);
    }
    .mini-circular-popup .leaflet-popup-content {
      margin: 0;
      width: 80px !important;
      height: 80px !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mini-circular-popup img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes sonar {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    .animate-sonar { animation: sonar 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    .animate-sonar-delay { animation: sonar 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; animation-delay: 1s; }
  </style>
  <script>
    // Critical browser environment shims
    window.process = { 
      env: { 
        NODE_ENV: 'production',
        API_KEY: '' 
      } 
    };
    window.global = window;
    
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            blue: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
            }
          }
        },
      },
    }
  </script>
<script type="importmap">
{

    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "leaflet": "https://esm.sh/leaflet@^1.9.4",
    "react-leaflet": "https://esm.sh/react-leaflet@^5.0.0",
    "supercluster": "https://esm.sh/supercluster@^8.0.1"
  }
}
</script>

</head>
